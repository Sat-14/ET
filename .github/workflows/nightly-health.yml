name: Nightly Health

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  nightly-health:
    name: Nightly Repo Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_TITLE: Nightly repo health check is failing

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Syntax smoke test
        id: smoke
        continue-on-error: true
        run: |
          python -m py_compile src/main.py dashboard/app.py src/engines/fire_path_planner.py
          python -c "from src.main import app; print(app.title)"

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          ruff check src dashboard tests --select E,F,W --ignore E501

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Build health summary
        id: summary
        if: always()
        shell: bash
        run: |
          HAS_FAILURES=false
          if [[ "${{ steps.smoke.outcome }}" == "failure" || "${{ steps.lint.outcome }}" == "failure" || "${{ steps.tests.outcome }}" == "failure" ]]; then
            HAS_FAILURES=true
          fi

          {
            echo "Nightly health check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
            echo "Smoke: ${{ steps.smoke.outcome }}"
            echo "Lint: ${{ steps.lint.outcome }}"
            echo "Tests: ${{ steps.tests.outcome }}"
          } > nightly-health-summary.txt

          echo "has_failures=${HAS_FAILURES}" >> "$GITHUB_OUTPUT"

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-health-artifacts
          path: |
            coverage.xml
            pytest.xml
            nightly-health-summary.txt
          if-no-files-found: ignore

      - name: Create or update failure issue
        if: always() && steps.summary.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const body = [
              "The scheduled nightly repo health workflow failed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              "",
              `Smoke: ${{ steps.smoke.outcome }}`,
              `Lint: ${{ steps.lint.outcome }}`,
              `Tests: ${{ steps.tests.outcome }}`,
              "",
              "Please review the workflow logs and uploaded artifacts."
            ].join("\n");

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another failing nightly run was detected: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Close resolved nightly issue
        if: always() && steps.summary.outputs.has_failures != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Nightly health check is green again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed"
            });

      - name: Fail workflow if checks failed
        if: always() && steps.summary.outputs.has_failures == 'true'
        run: exit 1
