name: Bug Report
description: Report a reproducible bug in the app, API, CI, or dashboard.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug with enough detail for reproduction and debugging.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where is the bug happening?
      options:
        - Backend API
        - Dashboard / Streamlit
        - Portfolio X-Ray
        - FIRE / Goal Planner
        - Tax / Insurance / Health Score
        - AI Chat / Agents
        - GitHub Actions / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: One-line description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Enter ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error logs or screenshots
      description: Paste stack traces, CI logs, console output, or screenshots if available.
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, browser, or workflow run link.
      placeholder: Windows 11, Python 3.13, Chrome 134, CI run URL

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues before opening this bug report.
          required: true
        - label: I included enough detail to reproduce the problem.
          required: true
